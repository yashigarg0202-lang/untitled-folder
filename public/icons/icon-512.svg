<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261F38"/>
      <stop offset="100%" stop-color="#0E0C14"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E600F"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" stroke="#52B788" stroke-width="1.5" opacity="0.3"/>

  <!-- Sacred Bay Leaf -->
  <path d="M256 70 C256 70 390 160 390 280 C390 370 330 430 256 445 C182 430 122 370 122 280 C122 160 256 70 256 70 Z"
        fill="url(#leafFill)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)"/>

  <!-- Stem & Leaf Veins -->
  <path d="M256 95 L256 430" stroke="#FFF2C6" stroke-width="5" stroke-linecap="round"/>
  <path d="M256 160 L330 200 M256 220 L350 265 M256 280 L355 330 M256 340 L335 390" stroke="#FFF2C6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M256 160 L182 200 M256 220 L162 265 M256 280 L157 330 M256 340 L177 390" stroke="#FFF2C6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Sacred Symbol Center -->
  <circle cx="256" cy="260" r="28" fill="#FFFBE6" filter="url(#goldGlow)"/>
  <text x="256" y="271" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="28" fill="#6B4B00" font-weight="bold">ॐ</text>

  <!-- Brand Typography -->
  <text x="256" y="480" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="22" fill="#FCE8B3" letter-spacing="4" font-weight="bold">SOULSYNC</text>
</svg>
