<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261F38"/>
      <stop offset="100%" stop-color="#0E0C14"/>
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E600F"/>
    </linearGradient>
    <linearGradient id="leafFillMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Maskable Icon Safe Zone -->
