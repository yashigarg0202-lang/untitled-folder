  <path d="M256 185 L315 220 M256 235 L330 270 M256 285 L335 320" stroke="#FFF2C6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M256 185 L197 220 M256 235 L182 270 M256 285 L177 320" stroke="#FFF2C6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <circle cx="256" cy="265" r="22" fill="#FFFBE6"/>
